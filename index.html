<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Plume & Voix</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- Banner -->
    <div class="banner">
      <div class="container">
        <h1>Plume & Voix</h1>
        <p>Des ateliers pour écrire, chanter et exprimer ses émotions.</p>
        <a href="#" class="btn-primary">Je m'inscris</a>
      </div>
    </div>

    <!-- Cards -->
    <div class="container">
      <div class="cards">
        <div class="card">
          <img src="images/atelier-poesie.jpg" alt="Atelier poésie">
          <h3>Atelier poésie</h3>
        </div>
        <div class="card">
          <img src="images/atelier-chant.jpg" alt="Atelier chant">
          <h3>Atelier chant</h3>
        </div>
        <div class="card">
          <img src="images/poesie-chantee.jpg" alt="Poésie chantée">
          <h3>Poésie chantée</h3>
        </div>
      </div>
    </div>

    <!-- Avatar -->
    <div class="container">
      <img src="images/imane.jpg" alt="Imane Bouaakil" class="avatar">
      <p>Ateliers animés par Imane.</p>
    </div>

    <!-- Typeform -->
    <div class="container">
      <div data-tf-widget="JCoyKAEp" style="width:100%;height:500px;"></div>
      <script src="//embed.typeform.com/next/embed.js"></script>
    </div>

  </body>
</html>
